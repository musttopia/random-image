
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Image</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 12px;
    }

    img {
      width: 90%;
      max-width: 420px;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <img id="photo" alt="Random image">

  <script>
    const images = [
      "https://i.ibb.co/cKVyL1Wj/153-20261012225014.jpg",
      "https://i.ibb.co/0RxjkRbp/153-20261012224914.jpg",
      "https://i.ibb.co/fV2XC9s9/153-20261012224721.jpg",
      "https://i.ibb.co/rfyf3JXx/153-20261012224639.jpg",
      "https://i.ibb.co/5hBnXbSx/153-20261012224541.jpg",
      "https://i.ibb.co/WNqLFHYq/153-20261012224310.jpg",
      "https://i.ibb.co/DDQRHNm8/153-20261012224147.jpg",
      "https://i.ibb.co/KzzSQYYR/229be571e1fd0e5cc05785f4039bc979.jpg"
    ];

    const i = Math.floor(Math.random() * images.length);

    document.getElementById("photo").src =
      images[i];
  </script>
</body>
</html>
