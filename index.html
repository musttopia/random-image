<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Image</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 12px;
    }

    img {
      display: block;
      width: 90%;
      max-width: 420px;
      max-height: 75vh;
      object-fit: contain;
      margin: 20px auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h2>🎲 Random Image</h2>
  <p id="status">กำลังโหลดรูปภาพ...</p>
  <img id="photo" alt="รูปที่สุ่มได้" hidden>

  <script>
    const images = [
      "https://ibb.co/Tqhq15N4",
      "https://ibb.co/9mNpqh7h",
      "https://ibb.co/Jw9RNwJW",
      "https://ibb.co/BHFfNth9",
      "https://ibb.co/KjWrpYBL",
      "https://ibb.co/SDWz069W",
      "https://ibb.co/1G8dYFPJ"
    ];

    const photo = document.getElementById("photo");
    const status = document.getElementById("status");

    const validImages = images.filter(url =>
      url.startsWith("https://") &&
      !url.startsWith("https://ใส่")
    );

    if (validImages.length === 0) {
      status.textContent =
        "ยังไม่มีลิงก์รูปจริง กรุณาแก้ไขโค้ด";
    } else {
      const index = Math.floor(
        Math.random() * validImages.length
      );

      photo.onload = () => {
        photo.hidden = false;
        status.textContent = "สุ่มรูปสำเร็จ!";
      };

      photo.onerror = () => {
        status.textContent =
          "โหลดรูปไม่ได้ กรุณาตรวจสอบลิงก์รูป";
      };

      photo.src = validImages[index];
    }
  </script>
</body>
</html>
